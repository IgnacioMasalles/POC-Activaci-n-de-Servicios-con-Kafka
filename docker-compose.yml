  crm-analytics-service:
    build: 
      context: ./apps/crm-analytics-service
    container_name: crm-analytics-service
    environment:
      MONGO_URI: 'mongodb://mongo:27017/crm-db'
      KAFKA_BROKERS: 'kafka:9092'
      KAFKA_CLIENT_ID: 'crm-svc'
      KAFKA_GROUP_ID: 'crm-group'
    depends_on:
      - kafka
